<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoPay — платежи через криптокошелёк</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --text:#e8ecf5; --muted:#8a95b0; --accent:#5b8cff; --ok:#2fbf71; --warn:#e8b23a; --bad:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0f1626; color:var(--text); font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button.secondary { background:#26304a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; word-break:break-all; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:700; }
  .PENDING { background:#2b3550; color:#aab6d8; } .CONFIRMING { background:#473a14; color:var(--warn); }
  .PAID { background:#123b27; color:var(--ok); } .FAILED,.EXPIRED { background:#40201e; color:var(--bad); }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; }
  .kv div:nth-child(odd) { color:var(--muted); }
  #msg { min-height:22px; margin-top:8px; font-size:14px; }
  .err { color:var(--bad); } .ok { color:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>CryptoPay</h1>
  <div class="sub">Платёжная система с интеграцией криптокошелька (MetaMask / Ethereum)</div>

  <div class="card">
    <h2>1. Кошелёк</h2>
    <div class="row">
      <button id="btnConnect">Подключить MetaMask</button>
      <span id="wallet" class="mono">не подключён</span>
    </div>
    <div class="sub" id="netInfo" style="margin:8px 0 0"></div>
  </div>

  <div class="card">
    <h2>2. Создать счёт</h2>
    <label for="amount">Сумма, ETH</label>
    <input id="amount" type="number" step="0.0001" min="0.0001" value="0.001">
    <label for="merchant">Адрес получателя (пусто — адрес магазина по умолчанию)</label>
    <input id="merchant" class="mono" placeholder="0x...">
    <label for="desc">Описание</label>
    <input id="desc" placeholder="Оплата заказа №1">
    <div class="row" style="margin-top:12px"><button id="btnCreate">Создать счёт</button></div>
  </div>

  <div class="card" id="payCard" hidden>
    <h2>3. Оплата</h2>
    <div class="kv" id="payInfo"></div>
    <div class="row" style="margin-top:14px">
      <button id="btnPay">Оплатить через MetaMask</button>
      <button id="btnDemo" class="secondary" hidden>Демо: имитировать перевод</button>
      <button id="btnRefresh" class="secondary">Обновить статус</button>
    </div>
  </div>

  <div id="msg"></div>

  <div class="card">
    <h2>История платежей</h2>
    <table><thead><tr><th>ID</th><th>Сумма</th><th>Статус</th><th>Tx</th></tr></thead><tbody id="history"></tbody></table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cfg = null, account = null, current = null, pollTimer = null;

function msg(text, cls) { const m = $('msg'); m.textContent = text || ''; m.className = cls || ''; }

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : 'Ошибка ' + r.status);
  return data;
}

function short(s) { return s ? s.slice(0, 8) + '…' + s.slice(-6) : '—'; }

function kv(el, rows) {
  el.replaceChildren();
  rows.forEach(([k, v, cls]) => {
    const a = document.createElement('div'); a.textContent = k;
    const b = document.createElement('div'); b.className = 'mono';
    if (cls) { const s = document.createElement('span'); s.className = 'badge ' + cls; s.textContent = v; b.appendChild(s); }
    else b.textContent = v;
    el.append(a, b);
  });
}

function renderPayment(p) {
  current = p;
  $('payCard').hidden = false;
  kv($('payInfo'), [
    ['ID', p.id], ['Статус', p.status, p.status], ['Сумма', p.amount + ' ' + p.currency],
    ['Комиссия сервиса', (Number(p.fee_wei) / 1e18) + ' ETH'], ['Получатель', p.merchant_address],
    ['Плательщик', p.payer_address || '—'], ['Tx hash', p.tx_hash || '—'], ['Подтверждений', String(p.confirmations)],
  ]);
  const done = ['PAID', 'FAILED', 'EXPIRED'].includes(p.status);
  $('btnPay').disabled = done || !window.ethereum;
  $('btnDemo').hidden = !(cfg && cfg.chain_mode === 'mock');
  $('btnDemo').disabled = done;
  if (p.status === 'PAID') msg('Платёж подтверждён ✔', 'ok');
  if (done) stopPolling();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(refresh, 4000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function refresh() {
  if (!current) return;
  try { renderPayment(await api('/api/payments/' + current.id + '/refresh', { method: 'POST' })); loadHistory(); }
  catch (e) { msg(e.message, 'err'); }
}

async function loadHistory() {
  const list = await api('/api/payments');
  const tb = $('history'); tb.replaceChildren();
  list.slice(0, 10).forEach((p) => {
    const tr = document.createElement('tr');
    [short(p.id), p.amount + ' ETH', null, short(p.tx_hash)].forEach((t, i) => {
      const td = document.createElement('td');
      if (i === 2) { const s = document.createElement('span'); s.className = 'badge ' + p.status; s.textContent = p.status; td.appendChild(s); }
      else { td.textContent = t; td.className = 'mono'; }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

async function switchNetwork() {
  try {
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: cfg.chain_id_hex }] });
  } catch (e) {
    if (e.code === 4902) {
      await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{
        chainId: cfg.chain_id_hex, chainName: cfg.chain_name, rpcUrls: [cfg.rpc_url],
        nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 } }] });
    } else throw e;
  }
}

$('btnConnect').onclick = async () => {
  if (!window.ethereum) { msg('MetaMask не найден. Установите расширение или используйте демо-режим.', 'err'); return; }
  try {
    const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
    account = accs[0];
    await switchNetwork();
    $('wallet').textContent = account;
    msg('Кошелёк подключён', 'ok');
  } catch (e) { msg(e.message, 'err'); }
};

$('btnCreate').onclick = async () => {
  try {
    const body = { amount: $('amount').value, description: $('desc').value };
    if ($('merchant').value.trim()) body.merchant_address = $('merchant').value.trim();
    renderPayment(await api('/api/payments', { method: 'POST', body: JSON.stringify(body) }));
    msg('Счёт создан. Оплатите его.', 'ok'); loadHistory();
  } catch (e) { msg(e.message, 'err'); }
};

$('btnPay').onclick = async () => {
  if (!current) return;
  try {
    if (!account) { await $('btnConnect').onclick(); if (!account) return; }
    const valueHex = '0x' + BigInt(current.amount_wei).toString(16);
    const txHash = await window.ethereum.request({ method: 'eth_sendTransaction',
      params: [{ from: account, to: current.merchant_address, value: valueHex }] });
    msg('Транзакция отправлена, ожидаем подтверждения…');
    renderPayment(await api('/api/payments/' + current.id + '/tx', { method: 'POST', body: JSON.stringify({ tx_hash: txHash }) }));
    startPolling(); loadHistory();
  } catch (e) { msg(e.message, 'err'); }
};

$('btnDemo').onclick = async () => {
  try {
    const { tx_hash } = await api('/api/dev/mock-tx', { method: 'POST', body: JSON.stringify({ payment_id: current.id }) });
    renderPayment(await api('/api/payments/' + current.id + '/tx', { method: 'POST', body: JSON.stringify({ tx_hash }) }));
    loadHistory();
  } catch (e) { msg(e.message, 'err'); }
};

$('btnRefresh').onclick = refresh;

(async () => {
  cfg = await api('/api/config');
  $('netInfo').textContent = 'Сеть: ' + cfg.chain_name + ' (chainId ' + cfg.chain_id + ') · режим: ' + cfg.chain_mode;
  if (cfg.chain_mode === 'mock') msg('Демо-режим: можно имитировать перевод без реального кошелька.');
  loadHistory();
})();
</script>
</body>
</html>
